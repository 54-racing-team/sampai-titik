name: Build Test

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: SampaiTitik
    strategy:
      matrix:
        scheme:
          - SampaiTitik
          # - "SampaiTitik Watch App"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (${{ matrix.scheme }})
        run: |
          xcodebuild build \
            -project SampaiTitik.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
